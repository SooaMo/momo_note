<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MomoNote — Français</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- 모바일 오버레이 -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- 왼쪽 목차 -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">MomoNote</div>
      <button id="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div id="nav-tree"></div>
    <div id="lang-switcher" class="lang-switcher"></div>
  </div>

  <!-- 오른쪽 메인 -->
  <div id="main">
    <div class="content-wrap">

      <!-- 등록 영역 (데스크탑) -->
      <div id="compose">
        <div class="compose-grid">
          <input type="text" id="inp-en"  placeholder="불어 표현 (예: C'est la vie)" />
          <input type="text" id="inp-ko"  placeholder="설명 (예: 인생이란 그런 거야)" />
          <input type="text" id="inp-src" placeholder="출처 (예: 드라마, 책 이름…)" class="src-input" />
          <input type="file" id="inp-img" accept="image/*,.gif" class="img-input" />
        </div>
        <div class="compose-bottom">
          <button class="btn-post" id="btn-post">등록</button>
        </div>
      </div>

      <!-- 타임라인 헤더 (필터 고정) -->
      <div id="timeline-header">
        <button id="nav-toggle-btn" onclick="openSidebar()">☰ 목차</button>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">전체</button>
          <button class="filter-tab" data-filter="unknown">모르는 것만</button>
          <button class="filter-tab" data-filter="known">아는 것만</button>
        </div>
      </div>

      <!-- 타임라인 -->
      <div id="timeline"></div>

    </div><!-- /.content-wrap -->
  </div>
</div>

<!-- 모바일 FAB -->
<button id="fab" onclick="openMobCompose()">＋</button>

<!-- 모바일 글쓰기 팝업 -->
<div id="mob-compose-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">새 표현 추가</span>
      <button class="modal-close" onclick="closeMobCompose()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-grid">
        <input type="text" id="mob-en" placeholder="불어 표현" />
        <input type="text" id="mob-ko" placeholder="설명" />
        <input type="text" id="mob-src" placeholder="출처" class="modal-full-row" />
      </div>
      <input type="file" id="mob-img" accept="image/*,.gif" />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeMobCompose()">취소</button>
      <button class="btn-post" id="mob-btn-post">등록</button>
    </div>
  </div>
</div>

<!-- 수정 팝업 -->
<div id="edit-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">포스팅 수정</span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <input type="hidden" id="edit-id" />
    <div class="modal-body">
      <div class="modal-grid">
        <input type="text" id="edit-en"  placeholder="불어 표현" />
        <input type="text" id="edit-ko"  placeholder="설명" />
        <input type="text" id="edit-src" placeholder="출처" class="modal-full-row" />
      </div>
      <div id="edit-img-preview" class="edit-img-preview"></div>
      <input type="file" id="edit-img" accept="image/*,.gif" />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn-post" id="btn-edit-save">저장</button>
    </div>
  </div>
</div>

<!-- 언어 설정 -->
<script>window.__LANG_COL__ = "fra_posts";</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
