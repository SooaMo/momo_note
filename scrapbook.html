<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MomoNote — Scrapbook</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="images/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <meta name="theme-color" content="#FDE8D8" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/Scrapbook.css" />
</head>
<body>
<div id="app">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">MomoNote</div>
      <button id="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div id="scrp-filter" class="scrp-filter-wrap">
      <div class="scrp-filter-label">Template</div>
      <div class="scrp-filter-item scrp-filter-active" data-tmpl="all"     onclick="setTmplFilter('all')">All</div>
      <div class="scrp-filter-item" data-tmpl="diary"   onclick="setTmplFilter('diary')">📔 Diary</div>
      <div class="scrp-filter-item" data-tmpl="drawing" onclick="setTmplFilter('drawing')">🎨 Drawing</div>
      <div class="scrp-filter-item" data-tmpl="idea"    onclick="setTmplFilter('idea')">💡 Idea</div>
      <div class="scrp-filter-item" data-tmpl="music"   onclick="setTmplFilter('music')">🎵 Music</div>
      <div class="scrp-filter-item" data-tmpl="review"  onclick="setTmplFilter('review')">🎬 Review</div>
      <div class="scrp-filter-item" data-tmpl="travel"  onclick="setTmplFilter('travel')">✈️ Travel</div>
      <div class="scrp-filter-item" data-tmpl="workout" onclick="setTmplFilter('workout')">💪 Workout</div>
    </div>
    <div id="nav-tree"></div>
    <div id="lang-switcher" class="lang-switcher"></div>
  </div>

  <div id="main">
    <div class="content-wrap">
      <div id="timeline-header">
        <!-- Always leftmost -->
        <button id="nav-toggle-btn" onclick="openSidebar()">☰ Menu</button>

        <!-- Desktop mini-bar: order:2 on desktop, hidden on mobile -->
        <div class="mp-bar" id="mp-bar-desktop">
          <span class="mp-note">🎵</span>
          <div class="mp-marquee-outer">
            <div class="mp-marquee-track" id="mp-marquee-track">
              <span id="mp-title-a">No music</span>
              <span id="mp-title-b" aria-hidden="true"></span>
            </div>
          </div>
          <button class="mp-icon-btn" onclick="mpPrev()">&#9664;&#9664;</button>
          <button class="mp-icon-btn mp-play" id="mp-play-btn" onclick="mpTogglePlay()"><svg class="mp-svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg></button>
          <button class="mp-icon-btn" onclick="mpNext()">&#9654;&#9654;</button>
          <button class="mp-icon-btn" id="mp-mode-btn" onclick="mpCycleMode()" title="Play mode">
            <svg id="mp-mode-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          </button>
          <input type="range" min="0" max="100" value="80" class="mp-vol" id="mp-vol" oninput="mpSetVol(+this.value)" title="Volume"/>
          <select class="mp-cat" id="mp-cat-select" onchange="changeMpCat(this.value)"></select>
          <button class="mp-list-btn" id="mp-list-btn" onclick="mpToggleTracklist()" title="Show track list">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="15" y2="6"/>
              <line x1="3" y1="11" x2="15" y2="11"/>
              <line x1="3" y1="16" x2="11" y2="16"/>
              <path d="M14 9l6-1v5"/>
              <circle cx="17" cy="17" r="2"/>
            </svg>
          </button>

          <!-- Tracklist panel — inside mp-bar so it aligns with it -->
          <div class="mp-tracklist-panel" id="mp-tracklist-panel">
            <div class="mp-tl-header">
              <span class="mp-tl-title" id="mp-tl-title">Playlist</span>
              <span class="mp-tl-cat" id="mp-tl-cat"></span>
              <button class="mp-tl-close" onclick="mpToggleTracklist()">✕</button>
            </div>
            <div class="mp-tl-tracks" id="mp-tl-tracks"></div>
          </div>
        </div>

        <!-- Logo: center on both desktop and mobile -->
        <span id="header-logo" class="scrp-header-logo" onclick="scrollToTop()">Scrapbook</span>

        <!-- Mobile music button: far right on mobile, hidden on desktop -->
        <button class="mp-mob-btn" id="mp-mob-btn" onclick="mpTogglePopup()">🎵</button>

        <!-- New button: desktop only, far right -->
        <button class="scrp-new-btn scrp-new-desktop" onclick="openScrpCompose()">＋ New</button>
      </div>

      <!-- Hidden YouTube player -->
      <div style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;">
        <iframe id="mp-yt-frame" src="" frameborder="0" allow="autoplay;encrypted-media"></iframe>
      </div>

      <div id="timeline"></div>
    </div>
  </div>
</div>

<button id="fab" onclick="openScrpCompose()">＋</button>

<!-- Compose modal -->
<div id="scrp-compose-modal">
  <div class="modal-box scrp-modal-box">
    <div class="modal-header">
      <span class="modal-title" id="scrp-modal-title">New Entry</span>
      <button class="modal-close" onclick="closeScrpCompose()">✕</button>
    </div>
    <div class="modal-body" id="scrp-modal-body">
      <div id="scrp-step-tmpl">
        <div class="scrp-tmpl-hint">Choose a template</div>
        <div class="scrp-tmpl-grid">
          <button class="scrp-tmpl-opt" onclick="selectTmpl('diary')"><span class="scrp-tmpl-icon">📔</span><span class="scrp-tmpl-name">Diary</span><span class="scrp-tmpl-desc">Date · weather · mood · title · entry</span></button>
          <button class="scrp-tmpl-opt" onclick="selectTmpl('drawing')"><span class="scrp-tmpl-icon">🎨</span><span class="scrp-tmpl-name">Drawing</span><span class="scrp-tmpl-desc">Canvas or upload · tag · notes</span></button>
          <button class="scrp-tmpl-opt" onclick="selectTmpl('idea')"><span class="scrp-tmpl-icon">💡</span><span class="scrp-tmpl-name">Idea</span><span class="scrp-tmpl-desc">Title · category · priority · image</span></button>
          <button class="scrp-tmpl-opt" onclick="selectTmpl('music')"><span class="scrp-tmpl-icon">🎵</span><span class="scrp-tmpl-name">Music</span><span class="scrp-tmpl-desc">Album · artist · category · YouTube</span></button>
          <button class="scrp-tmpl-opt" onclick="selectTmpl('review')"><span class="scrp-tmpl-icon">🎬</span><span class="scrp-tmpl-name">Review</span><span class="scrp-tmpl-desc">Title · source · rating · quote</span></button>
          <button class="scrp-tmpl-opt" onclick="selectTmpl('travel')"><span class="scrp-tmpl-icon">✈️</span><span class="scrp-tmpl-name">Travel</span><span class="scrp-tmpl-desc">Place · photos · cost · notes</span></button>
          <button class="scrp-tmpl-opt" onclick="selectTmpl('workout')"><span class="scrp-tmpl-icon">💪</span><span class="scrp-tmpl-name">Workout</span><span class="scrp-tmpl-desc">Type · exercises · condition</span></button>
        </div>
      </div>
      <div id="scrp-step-form" style="display:none"></div>
    </div>
    <div class="modal-footer" id="scrp-modal-footer" style="display:none">
      <button class="btn-cancel" onclick="backToTmplStep()">← Back</button>
      <button class="btn-post" id="scrp-btn-post">Post</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div id="scrp-edit-modal">
  <div class="modal-box scrp-modal-box">
    <div class="modal-header">
      <span class="modal-title">Edit Entry</span>
      <button class="modal-close" onclick="closeScrpEdit()">✕</button>
    </div>
    <input type="hidden" id="scrp-edit-id" />
    <div class="modal-body" id="scrp-edit-body"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeScrpEdit()">Cancel</button>
      <button class="btn-post" id="scrp-btn-edit-save">Save</button>
    </div>
  </div>
</div>

<script>window.__LANG_COL__ = "scrapbook_posts";</script>
<script type="module" src="js/Scrapbook.js"></script>

<!-- Music popup (fixed center, works on all screen sizes) -->
<div class="mp-mob-popup" id="mp-mob-popup">
  <div class="mp-pop-header">
    <span class="mp-pop-title-label">Now Playing</span>
    <button class="mp-pop-close" onclick="mpTogglePopup()">✕</button>
  </div>
  <div class="mp-pop-track" id="mp-pop-track">No music</div>
  <div class="mp-pop-controls">
    <button class="mp-icon-btn" onclick="mpPrev()">&#9664;&#9664;</button>
    <button class="mp-icon-btn mp-play" id="mp-play-btn-mob" onclick="mpTogglePlay()"><svg class="mp-svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg></button>
    <button class="mp-icon-btn" onclick="mpNext()">&#9654;&#9654;</button>
    <button class="mp-icon-btn" onclick="mpCycleMode()">
      <svg id="mp-mode-svg-mob" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/>
        <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
      </svg>
    </button>
  </div>
  <div class="mp-pop-bottom">
    <select class="mp-cat" id="mp-cat-select-mob" onchange="changeMpCat(this.value)"></select>
    <input type="range" min="0" max="100" value="80" class="mp-vol" id="mp-vol-mob" oninput="mpSetVol(+this.value)"/>
  </div>
</div>
<div class="mp-overlay" id="mp-overlay" onclick="mpTogglePopup()"></div>

</body>
</html>
