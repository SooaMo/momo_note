<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MomoNote</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="images/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <meta name="theme-color" content="#FDE8D8" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- Mobile overlay -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Left sidebar / nav -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">MomoNote</div>
      <button id="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div id="nav-search" class="nav-search">
      <input type="text" id="nav-search-input" placeholder="🔍 Search words..." autocomplete="off" />
      <button id="nav-search-clear" onclick="clearSearch()" style="display:none">✕</button>
    </div>
    <div id="nav-tree"></div>
    <div id="lang-switcher" class="lang-switcher"></div>
  </div>

  <!-- Right main area -->
  <div id="main">
    <div class="content-wrap">

      <!-- Compose area (desktop) -->
      <div id="compose">
        <div class="compose-grid">
          <textarea id="inp-en" placeholder="Expression (e.g. break a leg)" class="compose-textarea"></textarea>
          <textarea id="inp-ko" placeholder="Description (e.g. wishing you good luck)" class="compose-textarea"></textarea>
          <input type="text" id="inp-src" placeholder="Source (e.g. Netflix Drama, book title…)" class="src-input" autocomplete="off" />
        <div class="src-dropdown" id="src-dropdown-main" style="display:none"></div>
          <input type="file" id="inp-img" accept="image/*" class="img-input" />
          <input type="text" id="inp-words" placeholder="Unknown words (comma-separated, e.g. vexed, riper)" class="full-row" autocomplete="off" />
        </div>
        <div class="compose-bottom">
          <button class="btn-post" id="btn-post">Post</button>
        </div>
      </div>

      <!-- Timeline header (sticky filter bar) -->
      <div id="timeline-header">
        <button id="nav-toggle-btn" onclick="openSidebar()">☰ Menu</button>
        <span id="header-logo" onclick="setNavFilter(null);scrollToTop()">MomoNote</span>
        <!-- Desktop/tablet filter tabs -->
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="unknown">Unknown</button>
          <button class="filter-tab" data-filter="known">Known</button>
        </div>
        <!-- Mobile: filter dropdown + music btn in one row -->
        <div class="filter-mob-row">
          <select id="filter-mob-select" class="filter-mob-select">
            <option value="all">All</option>
            <option value="unknown">Unknown</option>
            <option value="known">Known</option>
          </select>
          <button class="wp-nav-music-btn" id="wp-mob-fab" onclick="wpToggleMobPopup()" aria-label="Music player">🎵</button>
        </div>
      </div>

      <!-- Timeline -->
      <div id="timeline"></div>

    </div><!-- /.content-wrap -->
  </div>
</div>

<!-- Mobile FAB button -->
<button id="fab" onclick="openMobCompose()">＋</button>

<!-- Mobile compose modal -->
<div id="mob-compose-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Add New Expression</span>
      <button class="modal-close" onclick="closeMobCompose()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-grid-single">
        <textarea id="mob-en" placeholder="Expression" class="compose-textarea"></textarea>
        <textarea id="mob-ko" placeholder="Description" class="compose-textarea"></textarea>
        <div class="src-autocomplete-wrap">
          <input type="text" id="mob-src" placeholder="Source" autocomplete="off" />
          <div class="src-dropdown" id="src-dropdown-mob" style="display:none"></div>
        </div>
        <input type="file" id="mob-img" accept="image/*" />
        <input type="text" id="mob-words" placeholder="Unknown words (comma-separated)" autocomplete="off" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeMobCompose()">Cancel</button>
      <button class="btn-post" id="mob-btn-post">Post</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div id="edit-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Edit Post</span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <input type="hidden" id="edit-id" />
    <div class="modal-body">
      <div class="modal-grid">
        <textarea id="edit-en" placeholder="Expression" class="compose-textarea"></textarea>
        <textarea id="edit-ko" placeholder="Description" class="compose-textarea"></textarea>
        <input type="text" id="edit-src" placeholder="Source" class="modal-full-row" />
      </div>
      <div id="edit-img-preview" class="edit-img-preview"></div>
      <input type="file" id="edit-img" accept="image/*" />
      <input type="text" id="edit-words" placeholder="Unknown words (comma-separated, e.g. steep, roguery)" autocomplete="off" style="margin-top:6px" />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn-post" id="btn-edit-save">Save</button>
    </div>
  </div>
</div>

<!-- Language setting: determines Firestore collection for this page -->
<script>window.__LANG_COL__ = "eng_posts";</script>
<script type="module" src="js/app.js"></script>

<!-- Bottom mini player (Words page) -->
<div class="words-player" id="words-player">

  <!-- Small tab — always visible, for toggling -->
  <div class="wp-tab" onclick="wpToggleCollapse()">
    <svg id="wp-collapse-svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
  </div>

  <!-- Player content (hidden when collapsed) -->
  <div class="wp-content" id="wp-content">
    <!-- Tracklist panel -->
    <div class="wp-tracklist" id="wp-tracklist">
      <div class="wp-tl-header">
        <span class="wp-tl-title">Playlist</span>
        <span class="wp-tl-cat" id="wp-tl-cat"></span>
        <button class="wp-tl-close" onclick="wpToggleTracklist()">✕</button>
      </div>
      <div class="wp-tl-tracks" id="wp-tl-tracks"></div>
    </div>
    <!-- Player bar -->
    <div class="wp-bar">
      <span class="wp-note">🎵</span>
      <div class="wp-marquee-outer">
        <div class="wp-marquee-track" id="wp-marquee-track">
          <span id="wp-title-a">No music</span>
          <span id="wp-title-b" aria-hidden="true"></span>
        </div>
      </div>
      <div class="wp-controls-row">
        <button class="wp-icon-btn" onclick="wpPrev()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="19,3 5,12 19,21"/><rect x="3" y="3" width="3" height="18" rx="1"/></svg></button>
        <button class="wp-icon-btn wp-play" id="wp-play-btn" onclick="wpTogglePlay()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg></button>
        <button class="wp-icon-btn" onclick="wpNext()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="5,3 19,12 5,21"/><rect x="18" y="3" width="3" height="18" rx="1"/></svg></button>
        <button class="wp-icon-btn" id="wp-mode-btn" onclick="wpCycleMode()">
          <svg id="wp-mode-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>
      <input type="range" min="0" max="100" value="20" class="wp-vol" id="wp-vol" oninput="wpSetVol(+this.value)" title="Volume"/>
      <select class="wp-cat" id="wp-cat-select" onchange="wpChangeCat(this.value)"></select>
      <button class="wp-list-btn" id="wp-list-btn" onclick="wpToggleTracklist()" title="Tracklist">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="11" x2="15" y2="11"/><line x1="3" y1="16" x2="11" y2="16"/><path d="M14 9l6-1v5"/><circle cx="17" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Hidden YouTube player -->
<div style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;">
  <iframe id="wp-yt-frame" src="" frameborder="0" allow="autoplay;encrypted-media"></iframe>
</div>


<div id="wp-mob-popup">
  <div class="wp-tl-header" style="padding:0 0 10px;border:none">
    <span class="wp-tl-title">Now Playing</span>
    <button class="wp-tl-close" onclick="wpToggleMobPopup()">✕</button>
  </div>
  <div style="font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="wp-mob-title">No music</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px">
    <button class="wp-icon-btn" onclick="wpPrev()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="19,3 5,12 19,21"/><rect x="3" y="3" width="3" height="18" rx="1"/></svg></button>
    <button class="wp-icon-btn wp-play" id="wp-play-btn-mob" onclick="wpTogglePlay()" style="width:28px;height:28px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/></svg></button>
    <button class="wp-icon-btn" onclick="wpNext()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21"/><rect x="18" y="3" width="3" height="18" rx="1"/></svg></button>
    <button class="wp-icon-btn" onclick="wpCycleMode()"><svg id="wp-mode-svg-mob" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
  </div>
  <div style="display:flex;align-items:center;gap:8px;border-top:0.5px solid #f0ede6;padding-top:10px">
    <select class="wp-cat" id="wp-cat-select-mob" onchange="wpChangeCat(this.value)" style="max-width:100px"></select>
    <input type="range" min="0" max="100" value="20" class="wp-vol" style="flex:1" oninput="wpSetVol(+this.value)"/>
  </div>
</div>

</body>
</html>
