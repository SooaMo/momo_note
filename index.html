<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MomoNote</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>


  <!-- 수정 팝업 -->
  <div id="edit-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">포스팅 수정</span>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <input type="hidden" id="edit-id" />
      <div class="modal-body">
        <div class="modal-grid">
          <input type="text" id="edit-en"  placeholder="영어 표현" />
          <input type="text" id="edit-ko"  placeholder="한글 의미" />
          <input type="text" id="edit-src" placeholder="출처" class="modal-full-row" />
        </div>
        <div id="edit-img-preview" class="edit-img-preview"></div>
        <input type="file" id="edit-img" accept="image/*,.gif" />
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeEditModal()">취소</button>
        <button class="btn-post" id="btn-edit-save">저장</button>
      </div>
    </div>
  </div>

<div id="app">

  <!-- 모바일 오버레이 -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- 왼쪽 목차 -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">MomoNote</div>
      <button id="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div id="nav-tree"></div>
  </div>

  <!-- 오른쪽 메인 -->
  <div id="main">

    <!-- 등록 영역 -->
    <div id="compose">
      <div class="compose-grid">
        <input type="text" id="inp-en"  placeholder="영어 표현 또는 문장" />
        <input type="text" id="inp-ko"  placeholder="해석 또는 노트" />
        <input type="text" id="inp-src" placeholder="출처 (예: Netflix Drama, 책 이름…)" class="src-input" />
        <input type="file" id="inp-img" accept="image/*,.gif" class="img-input" />
      </div>
      <div class="compose-bottom">
        <button class="btn-post" id="btn-post">Post</button>
      </div>
    </div>

    <!-- 타임라인 헤더 (필터 + 모바일 목차 버튼) -->
    <div id="timeline-header">
      <button id="nav-toggle-btn" onclick="openSidebar()">☰ 목차</button>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="unknown">모르는 것만</button>
        <button class="filter-tab" data-filter="known">아는 것만</button>
      </div>
    </div>

    <!-- 타임라인 -->
    <div id="timeline"></div>

  </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
